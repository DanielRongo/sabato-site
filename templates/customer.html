    /* ============ Tokens ============ */
    :root {
      --lime: rgb(204, 255, 0);        /* CTA / accent */
      --black: rgb(0, 0, 0);           /* dark bands */
      --ink: rgb(18, 10, 11);          /* primary text */
      --gray: rgb(69, 65, 64);         /* body/secondary text */
      --off: rgb(248, 244, 241);
      --mist: rgb(249, 250, 253);   /* very light grey, as used on the Framer pages */       /* light card background */
      --line: rgb(227, 226, 226);      /* hairlines */
      --blue: rgb(0, 102, 204);        /* text links - 5.6:1 on white, AA at any size */
      --font: "Satoshi", "Inter", -apple-system, "Helvetica Neue", sans-serif;
      --hand: "Kalam", cursive;
      --radius: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: #fff; color: var(--ink); }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    svg text { font-family: var(--font); }

    /* ============ Header / Nav ============ */
    .site-header { position: sticky; top: 0; z-index: 100; max-width: 1200px; margin: 0 auto; padding: 16px 30px; }
    .nav-shell { background: #fff; border-radius: var(--radius); height: 88px; padding: 16px 70px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .nav-logo img { width: 132px; height: auto; }
    .nav-links { display: flex; align-items: center; gap: 48px; }
    .nav-links a { font-size: 16px; font-weight: 500; line-height: 1.7; color: var(--ink); transition: opacity .2s; }
    .nav-links a:hover { opacity: .6; }
    .nav-links a.active { font-weight: 700; }
    .nav-flag { font-size: 16px; line-height: 1; }
    .btn-pill { display: inline-block; background: var(--lime); color: #000; border-radius: 100px; padding: 12px 30px; font-family: var(--font); font-size: 16px; font-weight: 700; line-height: 1.7; transition: transform .2s ease; white-space: nowrap; }
    .btn-pill:hover { transform: scale(1.04); }
    .tag { display: inline-block; background: var(--lime); color: #000; border-radius: 100px; padding: 4px 14px; font-size: 13px; font-weight: 700; line-height: 1.6; letter-spacing: .2px; }

    /* ============ Shell ============ */
    .shell { max-width: 1200px; margin: 0 auto; padding: 0 30px; }

    /* ============ 1. Split hero ============ */
    .split-hero { max-width: 1200px; margin: 0 auto; padding: 40px 40px 96px; display: grid; grid-template-columns: 1.04fr .96fr; gap: 64px; align-items: center; }
    .hero-copy .tag { margin-bottom: 24px; }
    .hero-copy h1 { font-size: 54px; font-weight: 700; letter-spacing: -1.9px; line-height: 1.1; color: var(--ink); margin: 0 0 22px; }
    .hero-copy .sub { font-size: 19px; font-weight: 400; line-height: 1.7; color: var(--gray); max-width: 520px; margin: 0 0 32px; }
    .hero-cta { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .hero-cta .hand { font-family: var(--hand); font-weight: 700; font-size: 19px; color: var(--ink); transform: rotate(-2deg); }
    .hero-visual svg { display: block; width: 100%; height: auto; max-width: 560px; margin: 0 auto; }

    /* ============ 2. Queue picture (dark band) ============ */
    .queue-band { background: var(--black); border-radius: var(--radius); margin: 0 auto; padding: 84px 72px 76px; max-width: 1200px; width: calc(100% - 80px); margin-left: auto; margin-right: auto;}
    .queue-inner { max-width: 1060px; margin: 0 auto; }
    .queue-band .eyebrow { color: var(--lime); font-size: 13px; font-weight: 700; letter-spacing: 2.5px; margin: 0 0 18px; }
    .queue-band h2 { color: #fff; font-size: 38px; font-weight: 700; letter-spacing: -1.1px; line-height: 1.15; margin: 0 0 26px; }
    .queue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .queue-grid .qcopy .qbody { color: rgba(248, 244, 241, .82); font-size: 17.5px; line-height: 1.75; margin: 0; }
    .queue-viz svg { display: block; width: 100%; height: auto; }
    .queue-viz .fine { color: rgba(248, 244, 241, .45); font-size: 12px; line-height: 1.6; margin: 18px 0 0; }

    /* ============ 3. Flow ============ */
    .flow { max-width: 1200px; margin: 0 auto; padding: 104px 40px 0; text-align: center; }
    .flow h2 { font-size: 38px; font-weight: 700; letter-spacing: -1.1px; line-height: 1.2; color: var(--ink); margin: 0 0 12px; }
    .flow-desktop { display: block; width: 100%; height: auto; margin: 28px auto 0; max-width: 1120px; }
    .flow-mobile { display: none; width: 100%; max-width: 360px; height: auto; margin: 20px auto 0; }
    .flow-caption { font-size: 16.5px; line-height: 1.7; color: var(--gray); max-width: 680px; margin: 26px auto 0; }

    /* ============ 4. Sample call (phone UI) ============ */
    .call-band { background: var(--mist); border-radius: var(--radius); margin: 104px auto 0; padding: 84px 40px 88px; text-align: center; max-width: 1200px; width: calc(100% - 80px); margin-left: auto; margin-right: auto;}
    .call-band h2 { font-size: 38px; font-weight: 700; letter-spacing: -1.1px; line-height: 1.2; color: var(--ink); margin: 0 0 8px; }
    .call-caption { font-size: 14px; font-weight: 500; color: var(--gray); opacity: .7; margin: 0; }
    .call-panel { width: 100%; max-width: 680px; margin: 42px auto 0; background: var(--black); border-radius: 28px; padding: 30px 38px 30px; text-align: left; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid rgba(248, 244, 241, .16); }
    .panel-head .ph-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #fff; }
    .panel-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); outline: 3px solid rgba(204, 255, 0, .35); }
    .panel-head .ph-time { font-size: 14px; font-weight: 500; color: rgba(248, 244, 241, .5); font-variant-numeric: tabular-nums; }
    .panel-head .ph-wave { width: 64px; height: 18px; flex: none; }
    .t-row { display: grid; grid-template-columns: 104px 1fr; gap: 20px; align-items: start; padding: 17px 0; border-bottom: 1px solid rgba(248, 244, 241, .08); }
    .t-row:last-of-type { border-bottom: 0; padding-bottom: 6px; }
    .t-spk { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; padding-top: 3px; }
    .t-spk svg { width: 16px; height: 12px; flex: none; }
    .t-row.caller .t-spk { color: rgba(248, 244, 241, .5); }
    .t-row.agent .t-spk { color: var(--lime); }
    .t-row p { font-size: 15.5px; line-height: 1.65; margin: 0; color: rgba(248, 244, 241, .85); }
    .t-row.agent p { color: #fff; }
    .phone-note { font-size: 16.5px; line-height: 1.7; color: var(--gray); max-width: 560px; margin: 30px auto 0; }

    /* ============ 5. Two-up value row ============ */
    .value-row { max-width: 1200px; margin: 24px auto 0; padding: 80px 40px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .value-card { background: var(--mist); border-radius: var(--radius); padding: 46px 44px 44px; }
    .value-card svg { display: block; height: 124px; width: auto; margin: 0 0 28px; }
    .value-card h3 { font-size: 25px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.25; color: var(--ink); margin: 0 0 14px; }
    .value-card p { font-size: 16.5px; line-height: 1.7; color: var(--gray); margin: 0; }

    /* ============ 6. CTA band ============ */
    .cta-band { background: var(--black); border-radius: var(--radius); margin: 96px auto 40px; padding: 88px 40px; text-align: center; max-width: 1200px; width: calc(100% - 80px); margin-left: auto; margin-right: auto;}
    .cta-band .hand { font-family: var(--hand); font-weight: 700; font-size: 19px; color: #fff; margin-bottom: 14px; }
    .cta-band h2 { color: #fff; font-size: 48px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.15; max-width: 720px; margin: 0 auto 16px; }
    .cta-band p { color: #fff; opacity: .8; font-size: 19px; line-height: 1.7; max-width: 560px; margin: 0 auto 34px; }


    /* ============ Customer story ============ */
    /* Draft placeholders. Deliberately loud: an unapproved number attached to a
       real, named customer is the one thing that must never ship by accident. */
    /* Opaque on purpose: these chips sit on both the white sections and the
       black results band, so a translucent tint fails contrast on one or the
       other. Painting their own background makes them legible anywhere. */
    .ph { position: relative; display: inline-block; border: 2px dashed rgb(196,102,0);
          background: rgb(255,236,208); border-radius: 8px; padding: 2px 10px;
          color: rgb(102,50,0); font-style: normal; }
    .ph::after { content: "TBC"; position: absolute; top: -9px; right: -10px;
                 background: rgb(255,138,0); color: #fff; font-size: 9px; font-weight: 900;
                 letter-spacing: .06em; padding: 1px 5px; border-radius: 5px; }
    .draft-ribbon { position: fixed; top: 0; left: 0; z-index: 9999; background: rgb(255,138,0);
                    color: #000; font-size: 11px; font-weight: 900; letter-spacing: .1em;
                    padding: 5px 14px; border-bottom-right-radius: 10px; }

    .qcopy .qbody + .qbody { margin-top: 18px; }
    .cust-logo { height: 34px; width: auto; margin-bottom: 20px; }
    .cust-logo-fallback { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px;
                          font-size: 19px; font-weight: 900; letter-spacing: -.4px; color: var(--ink); }
    .cust-logo-fallback .mono { width: 34px; height: 34px; border-radius: 9px; background: var(--ink);
                                color: var(--lime); display: grid; place-items: center;
                                font-size: 14px; font-weight: 900; letter-spacing: 0; }

    /* results - three numbers, the reason the page exists */
    .results { max-width: 1200px; width: calc(100% - 80px); margin: 96px auto 0; background: var(--black);
               border-radius: var(--radius); padding: 76px 48px; }
    .results .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
                        color: var(--lime); text-align: center; margin-bottom: 14px; }
    .results h2 { font-size: 42px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.15;
                  color: #fff; text-align: center; margin-bottom: 46px; }
    .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
                max-width: 1000px; margin: 0 auto; }
    .res-card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
                border-radius: 18px; padding: 34px 26px; text-align: center; }
    .res-num { font-size: 56px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: var(--lime); }
    .res-lab { font-size: 15px; font-weight: 700; color: #fff; margin-top: 14px; }
    .res-sub { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.62); margin-top: 8px; }
    .res-foot { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.5);
                text-align: center; margin-top: 32px; }

    /* pull quote - the named human */
    .pq { max-width: 1200px; width: calc(100% - 80px); margin: 96px auto 0; background: var(--mist);
          border-radius: var(--radius); padding: 76px 48px; text-align: center; }
    /* Portrait carries real weight here. A named CEO shown at 260px reads as a
       company standing behind the words; the same face at 56px reads as a stock
       avatar and does the opposite. */
    .pq { display: grid; grid-template-columns: 260px 1fr; gap: 52px; align-items: center;
          text-align: left; padding: 68px 56px; }
    .pq .portrait { width: 260px; height: 260px; border-radius: 20px; object-fit: cover;
                    display: block; }
    .pq .mono-lg { width: 260px; height: 260px; border-radius: 20px; background: var(--ink);
                   color: var(--lime); display: grid; place-items: center;
                   font-size: 62px; font-weight: 900; }
    .pq blockquote { font-size: 30px; font-weight: 700; letter-spacing: -.8px; line-height: 1.36;
                     color: var(--ink); margin: 0; }
    .pq .who { margin-top: 26px; }
    .pq .who strong { display: block; font-size: 17px; font-weight: 700; color: var(--ink); }
    .pq .who span { font-size: 15px; color: var(--gray); }
    .pq .pending { display: inline-block; margin-top: 26px; border: 2px dashed rgb(196,102,0);
                   background: rgb(255,236,208); color: rgb(102,50,0); border-radius: 8px;
                   padding: 6px 14px; font-size: 13px; font-weight: 700; }

    /* honest limits - what it does NOT do */
    .honest { max-width: 1200px; width: calc(100% - 80px); margin: 96px auto 0; border: 1px solid var(--line);
              border-radius: var(--radius); padding: 60px 48px; }
    .honest h2 { font-size: 30px; font-weight: 700; letter-spacing: -.8px; margin-bottom: 10px; }
    .honest > p { font-size: 17px; line-height: 1.75; color: var(--gray); max-width: 760px; }
    .honest ul { list-style: none; margin-top: 26px; display: grid; gap: 12px; }
    .honest li { display: flex; gap: 12px; font-size: 16px; line-height: 1.7; color: var(--gray); }
    .honest li::before { content: "-"; color: var(--ink); font-weight: 700; flex: none; }

    /* stack section */
    .stack { max-width: 1200px; width: calc(100% - 80px); margin: 96px auto 0; }
    .stack h2 { font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-bottom: 28px; }
    .stack-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .stack-card { border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
    .stack-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .stack-card p { font-size: 15px; line-height: 1.7; color: var(--gray); }

    @media (max-width: 809px) {
      .results, .pq, .honest, .stack { width: calc(100% - 32px); margin-top: 72px; padding-left: 24px; padding-right: 24px; }
      .results { padding-top: 56px; padding-bottom: 56px; }
      .results h2 { font-size: 30px; }
      .res-grid, .stack-grid { grid-template-columns: 1fr; }
      .res-num { font-size: 46px; }
      .pq blockquote { font-size: 23px; }
      .pq { padding-top: 56px; padding-bottom: 56px; }
      .honest { padding: 40px 24px; }
      .stack h2 { font-size: 26px; }
    }


    /* browser frame for the customer's storefront */
    .browser { border-radius: 14px; overflow: hidden; background: #fff;
               box-shadow: 0 24px 60px rgba(0,0,0,.34); border: 1px solid rgba(255,255,255,.14); }
    .browser .bar { display: flex; align-items: center; gap: 7px; padding: 11px 14px;
                    background: rgb(238,236,234); border-bottom: 1px solid rgb(219,216,214); }
    .browser .bar i { width: 10px; height: 10px; border-radius: 50%; background: rgb(203,199,196); }
    .browser .bar .url { flex: 1; margin-left: 8px; background: #fff; border-radius: 6px;
                         font-size: 11.5px; color: rgb(110,106,104); padding: 4px 10px;
                         font-family: var(--font); }
    .browser { display: flex; flex-direction: column; height: 100%; }
    .browser img { width: 100%; flex: 1; min-height: 0; object-fit: cover;
                   object-position: top center; display: block; }
    .queue-grid.with-shot { display: grid; grid-template-columns: 1fr 1fr; gap: 48px;
                            align-items: stretch; }


    /* Coverage matrix - identity, not magnitude, so it is a diagram and not a
       chart: no axis, no scale, nothing to mis-encode. It also carries no call
       volumes, which is the constraint the storefront screenshot met but a
       demand curve could not. */
    .cov { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
           border-radius: 20px; padding: 34px 32px; height: 100%;
           display: flex; flex-direction: column; justify-content: center; }
    .cov-h { font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
             color: var(--lime); margin: 0 0 22px; }
    .cov-grid { display: grid; grid-template-columns: 1.5fr repeat(3, 1fr); gap: 10px 8px;
                align-items: center; }
    .cov-grid .lang { font-size: 12px; font-weight: 800; letter-spacing: .06em;
                      color: rgba(255,255,255,.66); text-align: center; text-transform: uppercase; }
    .cov-grid .queue { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.35; }
    .cov-cell { height: 40px; border-radius: 10px; background: rgba(204,255,0,.13);
                border: 1px solid rgba(204,255,0,.34); display: grid; place-items: center; }
    .cov-cell svg { width: 17px; height: 17px; }
    .cov-note { font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,.6);
                margin: 22px 0 0; }
    @media (max-width: 809px) {
      .cov { padding: 26px 20px; }
      .cov-grid { grid-template-columns: 1.3fr repeat(3, 1fr); gap: 8px 6px; }
      .cov-grid .queue { font-size: 13.5px; }
      .cov-cell { height: 34px; }
    }


    /* Knowledge-base panel. Used where a coverage matrix would be thin - two
       agents in one language is a 2x1 grid, which reads as a stub. This shows
       what the agent actually knows, which is the point that section argues. */
    .kb { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
          border-radius: 20px; padding: 34px 32px; height: 100%;
          display: flex; flex-direction: column; justify-content: center; }
    .kb-h { font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
            color: var(--lime); margin: 0 0 8px; }
    .kb-n { font-size: 40px; font-weight: 900; letter-spacing: -1.4px; color: #fff; margin: 0 0 22px; }
    .kb-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .kb-list span { font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.86);
                    background: rgba(204,255,0,.13); border: 1px solid rgba(204,255,0,.32);
                    border-radius: 999px; padding: 7px 14px; }
    .kb-note { font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,.6); margin: 22px 0 0; }
    @media (max-width: 809px) { .kb { padding: 26px 20px; } .kb-n { font-size: 32px; } }

    /* Forward look - the closing "this is still climbing" band */
    .fwd { max-width: 1200px; width: calc(100% - 80px); margin: 96px auto 0;
           border: 1px solid var(--line); border-radius: var(--radius); padding: 56px 48px; }
    .fwd .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .13em;
                    text-transform: uppercase; color: var(--gray); margin: 0 0 12px; }
